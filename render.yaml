services:
  - type: web
    name: rsm-messenger-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MOCK_OTP_ENABLED
        value: "false"
      - key: MOCK_OTP_CODE
        value: "123456"
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
